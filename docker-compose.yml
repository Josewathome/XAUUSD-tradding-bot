# HOW ENV FILES WORK HERE
# ──────────────────────────────────────────────────────────────────
# Docker Compose automatically loads .env for ${VAR} substitution
# inside this file.  Any $ in those values is treated as a variable
# reference, which corrupts passwords.  To avoid that:
#
#   .env          — only VNC_USER and VNC_PASSWORD (used as ${VNC_USER}
#                   below).  Keep these simple — no $ in the values.
#
#   secrets.env   — ALL other credentials (MT5, dashboard, news API,
#                   email).  Loaded via env_file: only, so Docker never
#                   interpolates it.  Passwords with $ or & are safe.
#
# Setup:
#   cp env.example .env          # fill in VNC_USER / VNC_PASSWORD
#   cp secrets.example secrets.env   # fill in all other credentials
#
# Dashboard: http://localhost:8001   |   MT5 VNC: http://localhost:3001

services:
  xauusd-bot:
    image: gmag11/metatrader5_vnc:latest
    container_name: xauusd-bot
    restart: unless-stopped
    stop_grace_period: 30s   # Give SIGTERM 30s to flush checkpoint before SIGKILL.
    ports:
      - "3001:3000"       # noVNC browser UI → http://localhost:3001
      - "8001:8080"       # Trading dashboard → http://localhost:8001
    env_file:
      - secrets.env       # raw pass-through — $ in passwords is safe here
    environment:
      # VNC login — read from .env via ${} substitution (keep values $ -free)
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
      # KasmVNC performance — no credentials, interpolation safe
      - DRINODE=/dev/dri/renderD128
      - DISPLAY_SIZEW=1280
      - DISPLAY_SIZEH=900
      - DISPLAY_REFRESH=60
      - KASMVNC_RECT_THREADS=4
    shm_size: "256m"     # Wine + KasmVNC needs > 64 MB default; 256 MB prevents crashes
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - default
      - forex-shared
    volumes:
      - mt5_config:/config
      - ./fix_rpyc.sh:/custom-cont-init.d/fix_rpyc.sh   # no-op, kept to avoid init error
      - ./override_start.sh:/Metatrader/start.sh
      - .:/bot                                            # code + persistent data on host
      - news_cache:/bot/.cache                            # news API cache — in-container, wiped Friday
      - ./analytics:/bot/analytics                        # tick velocity analytics — persisted on host
      - ./.checkpoints:/bot/.checkpoints                  # restart checkpoints — persisted on host
      - ./logs:/bot/logs                                  # trading logs — persisted on host
      # Strategy engine is pluggable (src/strategy/interfaces.py); the framework

volumes:
  mt5_config:
    external: true          # dedicated volume for xauusd-bot — isolated from other MT5 containers
    name: xauusd_bot_mt5_config
  news_cache:               # news API TTL cache — wiped every Friday at market close
    external: true
    name: forex_bot_news_cache

networks:
  default: {}
  forex-shared:
    # external: true tells Docker Compose to attach to the pre-existing network
    # named exactly "forex-shared" instead of creating a new prefixed one
    # (e.g. "new-forex-bot_forex-shared").  The forex-api project creates this
    # network first; this bot simply joins it on every restart.
    # If forex-api is not running yet, create the network manually once:
    #   docker network create forex-shared
    external: true