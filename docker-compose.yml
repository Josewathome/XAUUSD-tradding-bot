# Before first run: copy env.example to .env and fill in your real credentials.
# Dashboard: http://localhost:8001   |   MT5 VNC: http://localhost:3001  (XAUUSD bot)
#
# NOTE ON PASSWORDS WITH SPECIAL CHARACTERS ($ & ! etc.)
# Docker Compose warns "variable not set" when a password contains $ — that is
# harmless.  The credential is NOT corrupted: override_start.sh re-reads
# MT5_PASSWORD directly from /bot/.env using grep/sed, bypassing Compose
# interpolation entirely (same technique used in the scalper container).

services:
  xauusd-bot:
    image: gmag11/metatrader5_vnc:latest
    container_name: xauusd-bot
    restart: unless-stopped
    stop_grace_period: 30s   # Give SIGTERM 30s to trigger the bot's clean shutdown
                              # handler and flush a final checkpoint before SIGKILL.
                              # Default Docker timeout is 10s — too short for MT5 + Wine.
    ports:
      - "3001:3000"       # noVNC browser UI → http://localhost:3001
      - "8001:8080"       # Trading dashboard → http://localhost:8001
    env_file:
      - .env
    environment:
      # VNC login — read from .env via ${} substitution.
      # If VNC_PASSWORD contains $ Docker warns but the VNC login still works
      # (KasmVNC reads the env var directly, not through Compose substitution).
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
      # KasmVNC performance settings
      - DRINODE=/dev/dri/renderD128
      - DISPLAY_SIZEW=1280
      - DISPLAY_SIZEH=900
      - DISPLAY_REFRESH=60
      - KASMVNC_RECT_THREADS=4

      # All other credentials (MT5_PASSWORD, TRADING_ID, MT5_SERVER, etc.) are
      # passed via env_file above.  override_start.sh re-reads MT5_PASSWORD raw
      # from /bot/.env so $ in the password never reaches Compose interpolation.
    shm_size: "256m"     # Wine + KasmVNC needs > 64 MB default; 256 MB prevents crashes
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - default
      - forex-shared
    volumes:
      - mt5_config:/config
      - ./fix_rpyc.sh:/custom-cont-init.d/fix_rpyc.sh   # no-op, kept to avoid init error
      - ./override_start.sh:/Metatrader/start.sh
      - .:/bot                                            # code + persistent data on host
      - news_cache:/bot/.cache                            # news API cache — in-container, wiped Friday
      - ./analytics:/bot/analytics                        # tick velocity analytics — persisted on host
      - ./.checkpoints:/bot/.checkpoints                  # restart checkpoints — persisted on host
      - ./logs:/bot/logs                                  # trading logs — persisted on host

volumes:
  mt5_config:
    external: true          # dedicated volume for xauusd-bot — isolated from other MT5 containers
    name: xauusd_bot_mt5_config
  news_cache:               # news API TTL cache — wiped every Friday at market close
    external: true
    name: forex_bot_news_cache

networks:
  default: {}
  forex-shared:
    external: true
